name: Verify ChatTBM

on:
  pull_request:
  push:
    branches: [main, auth-foundation-design]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies and refresh lockfile
        run: npm install
      - name: Commit refreshed lockfile on feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/auth-foundation-design'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: synchronize npm lockfile"
            git push
          fi
      - name: Run tests
        run: node --test
