name: Verify ChatTBM

on:
  pull_request:
  push:
    branches: [main, auth-foundation-design]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run tests
        env:
          CHATTBM_TEST_DATABASE_URL: ${{ secrets.CHATTBM_TEST_DATABASE_URL }}
          CHATTBM_TEST_DATABASE_SSL: 'true'
        run: node --test

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit dependencies
        run: npm audit

  sync-lockfile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/auth-foundation-design'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: auth-foundation-design
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh npm lockfile
        run: npm install
      - name: Commit refreshed lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: synchronize npm lockfile"
            git push
          fi

  staging-readonly-diagnostic:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run read-only isolated staging schema diagnostic
        env:
          STAGING_READONLY_CHECK_TOKEN: ${{ secrets.STAGING_READONLY_CHECK_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.STAGING_READONLY_CHECK_TOKEN;
          if (!token) throw new Error("STAGING_READONLY_CHECK_TOKEN secret is missing");
          const response = await fetch("https://chattbm-staging-db-check.onrender.com/api/internal/staging-db-check", {
            headers: { "x-staging-check-token": token },
            signal: AbortSignal.timeout(25000)
          });
          const body = await response.json().catch(() => ({}));
          if (!response.ok || body.success !== true ||
              body.database !== "chattbm_staging_isolated" ||
              body.readOnly !== true || !body.schema ||
              !Array.isArray(body.schema.expectedMigrationTables) ||
              !Array.isArray(body.schema.tables) ||
              !Array.isArray(body.schema.missingExpectedTables)) {
            throw new Error("Read-only staging diagnostic failed: HTTP " + response.status +
              ", error " + (body.error || "unknown") +
              ", category " + (body.category || "none"));
          }
          console.log("Database: " + body.database + " (read-only)");
          console.log("Expected tables: " + JSON.stringify(body.schema.expectedMigrationTables));
          console.log("Present tables: " + JSON.stringify(body.schema.tables));
          console.log("Missing tables: " + JSON.stringify(body.schema.missingExpectedTables));
          console.log("User row count: " + body.schema.userRowCount);
          if (body.schema.missingExpectedTables.length > 0) {
            throw new Error("Staging schema is incomplete; missing expected tables are listed above. No migration was run.");
          }
          NODE
