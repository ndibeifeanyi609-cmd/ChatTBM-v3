name: Verify ChatTBM

on:
  pull_request:
  push:
    branches: [main, auth-foundation-design]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies and refresh lockfile in runner
        run: npm install
      - name: Run tests
        run: node --test
