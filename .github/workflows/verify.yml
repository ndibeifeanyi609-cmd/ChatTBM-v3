name: Verify ChatTBM

on:
  pull_request:
  push:
    branches: [main, auth-foundation-design]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies and apply non-breaking security fixes
        run: npm audit fix
      - name: Verify dependency audit
        run: npm audit --audit-level=moderate
      - name: Run tests
        env:
          CHATTBM_TEST_DATABASE_URL: ${{ secrets.CHATTBM_TEST_DATABASE_URL }}
          CHATTBM_TEST_DATABASE_SSL: 'true'
        run: node --test
      - name: Commit updated lockfile after successful checks
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix: resolve npm dependency vulnerabilities"
            git push origin HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}
          fi

  sync-lockfile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/auth-foundation-design'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: auth-foundation-design
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh npm lockfile
        run: npm install
      - name: Commit refreshed lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: synchronize npm lockfile"
            git push
          fi
