name: Memory Integration Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'chatInteraction/**'
      - 'memory/**'
      - 'services/assistantEngine.js'
      - 'tests/assistantEngine.test.js'
      - 'tests/explicitMemoryIntent.test.js'
      - '.github/workflows/memory-tests.yml'
  workflow_dispatch:

jobs:
  memory-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chattbm_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: chattbm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chattbm_test -d chattbm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://chattbm_test:test_password@localhost:5432/chattbm_test
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Test assistant memory context
        run: node tests/assistantEngine.test.js
      - name: Test explicit memory intent
        run: node tests/explicitMemoryIntent.test.js
      - name: Test memory persistence
        run: node tests/memoryPersistence.test.js
      - name: Test memory boundary ownership and isolation
        run: node tests/memoryBoundary.test.js
      - name: Test memory boundary reload and ownership
        run: node tests/memoryBoundary.integration.test.js
      - name: Test PostgreSQL memory adapter
        run: node tests/postgresMemoryPersistence.test.js
      - name: Test real PostgreSQL memory integration
        run: node tests/postgresMemoryPersistence.integration.test.js

  test-database-credential:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.CHATTBM_TEST_DATABASE_URL }}
      NODE_ENV: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Require the test database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::CHATTBM_TEST_DATABASE_URL is not configured."
            exit 1
          fi
      - name: Refuse to connect to a non-test database
        run: |
          node -e "const u = new URL(process.env.DATABASE_URL); if (decodeURIComponent(u.pathname.slice(1)) !== 'chattbm_db') { console.error('Refusing to run: expected the chattbm_db test database.'); process.exit(1); }"
      - name: Verify rotated test database credential
        run: node tests/postgresMemoryPersistence.integration.test.js
