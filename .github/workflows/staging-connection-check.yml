name: Read-only staging database connection check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connection-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify isolated staging connection through protected Render endpoint
        env:
          STAGING_READONLY_CHECK_TOKEN: ${{ secrets.STAGING_READONLY_CHECK_TOKEN }}
        run: |
          node --input-type=module -e '
            const token = process.env.STAGING_READONLY_CHECK_TOKEN;
            if (!token) throw new Error("STAGING_READONLY_CHECK_TOKEN secret is missing");
            const response = await fetch("https://chattbm-staging-db-check.onrender.com/api/internal/staging-db-check", {
              headers: { "x-staging-check-token": token },
              signal: AbortSignal.timeout(20000)
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.success !== true || body.database !== "chattbm_staging_isolated" || body.readOnly !== true) {
              throw new Error("Protected staging database check failed (HTTP " + response.status + ", code " + (body.error || "unknown") + ")");
            }
            console.log("Read-only connection verified for isolated staging database.");
          '
