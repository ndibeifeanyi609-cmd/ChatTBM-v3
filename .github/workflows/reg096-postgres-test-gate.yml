name: REG-096 Disposable PostgreSQL Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'database/migrations/**'
      - 'scripts/db-migrate.js'
      - 'tests/reg096-migration/**'
      - '.github/workflows/reg096-postgres-test-gate.yml'
  push:
    branches: [feature/founder-admin-design]
    paths:
      - 'database/migrations/**'
      - 'scripts/db-migrate.js'
      - 'tests/reg096-migration/**'
      - '.github/workflows/reg096-postgres-test-gate.yml'

permissions:
  contents: read

jobs:
  disposable-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chattbm_test
          POSTGRES_USER: chattbm_test
          POSTGRES_PASSWORD: disposable_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chattbm_test -d chattbm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://chattbm_test:disposable_test_only@localhost:5432/chattbm_test
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prove the disposable database is isolated and reachable
        run: |
          node -e "const {Client}=require('pg'); (async()=>{const c=new Client({connectionString:process.env.DATABASE_URL}); try { await c.connect(); const r=await c.query('SELECT current_database() AS name, current_user AS username'); if(r.rows[0].name!=='chattbm_test'||r.rows[0].username!=='chattbm_test') throw new Error('Unexpected test database identity'); console.log('Disposable PostgreSQL gate ready:',r.rows[0].name); } finally { await c.end(); } })().catch(e=>{ console.error('Disposable PostgreSQL gate failed'); process.exit(1); });"
      - name: Check migration runner syntax
        run: node --check scripts/db-migrate.js
      - name: Test migration safety gates and discovery
        run: node --test tests/reg096-migration/safety.test.js tests/reg096-migration/discovery.test.js
      - name: Test migration runner against disposable PostgreSQL
        run: node --test tests/reg096-migration/runner.test.js
