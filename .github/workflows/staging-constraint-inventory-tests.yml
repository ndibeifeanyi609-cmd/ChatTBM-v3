name: Staging Constraint Inventory Tests

on:
  pull_request:
    branches:
      - main
      - fix/staging-diagnostic-internal-db-url
    paths:
      - 'database/stagingConstraintInventoryQuery.js'
      - 'tests/stagingConstraintInventory.integration.test.js'
      - 'routes/internalStagingDbCheckRoute.js'
      - '.github/workflows/staging-constraint-inventory-tests.yml'

jobs:
  postgres-constraint-inventory:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chattbm_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: chattbm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chattbm_test -d chattbm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://chattbm_test:test_password@localhost:5432/chattbm_test
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test PostgreSQL constraint inventory
        run: node tests/stagingConstraintInventory.integration.test.js
