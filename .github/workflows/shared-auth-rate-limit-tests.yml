name: Shared Auth Rate Limit Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'auth/rateLimit.js'
      - 'auth/rateLimit.test.js'
      - 'tests/sharedAuthRateLimit.integration.test.js'
  workflow_dispatch:

jobs:
  shared-auth-rate-limit-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chattbm_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: chattbm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chattbm_test -d chattbm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://chattbm_test:test_password@localhost:5432/chattbm_test
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run existing rate-limit unit tests
        run: node --test auth/rateLimit.test.js
      - name: Run shared rate-limit PostgreSQL integration tests
        run: |
          if [ ! -f tests/sharedAuthRateLimit.integration.test.js ]; then
            echo "::error::Shared PostgreSQL rate-limit integration tests are not implemented yet."
            exit 1
          fi
          node --test tests/sharedAuthRateLimit.integration.test.js
