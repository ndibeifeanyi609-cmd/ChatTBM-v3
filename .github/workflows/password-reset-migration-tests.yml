name: Password Reset Migration Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'database/migrations/004_password_reset_tokens.sql'
      - 'tests/passwordResetMigration.integration.test.js'
      - '.github/workflows/password-reset-migration-tests.yml'
  workflow_dispatch:

jobs:
  password-reset-migration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chattbm_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: chattbm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chattbm_test -d chattbm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://chattbm_test:test_password@localhost:5432/chattbm_test
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run password-reset PostgreSQL migration integration test
        run: node --test tests/passwordResetMigration.integration.test.js
