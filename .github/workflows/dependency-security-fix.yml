name: ChatTBM Dependency Security Fix

on:
  push:
    branches: [security/dependency-audit-fix]

permissions:
  contents: write

jobs:
  safe-audit-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: security/dependency-audit-fix
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install locked dependencies
        run: npm ci
      - name: Override vulnerable transitive qs version
        run: |
          npm pkg set 'overrides.qs=6.16.1'
          npm install
          npm ls qs
      - name: Run full test suite
        env:
          CHATTBM_TEST_DATABASE_URL: ${{ secrets.CHATTBM_TEST_DATABASE_URL }}
          CHATTBM_TEST_DATABASE_SSL: 'true'
        run: node --test
      - name: Verify security audit
        run: npm audit
      - name: Commit dependency security update
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "fix: override vulnerable qs dependency"
            git push
          fi
