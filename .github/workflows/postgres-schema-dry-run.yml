name: PostgreSQL Schema Dry-Run Comparator

on:
  pull_request:
    branches: [main]
    paths:
      - 'database/Postgres.js'
      - 'database/migrations/**'
      - 'database/schemaDryRunComparator.js'
      - 'database/schemaKnownDifferencePolicy.js'
      - 'tests/postgresMigrationInventory.integration.test.js'
      - 'tests/schemaDryRunComparator.test.js'
      - 'tests/schemaKnownDifferencePolicy.test.js'
      - 'tests/schemaDryRunComparator.integration.test.js'
      - '.github/workflows/postgres-schema-dry-run.yml'
  workflow_dispatch:

jobs:
  schema-dry-run:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: chattbm_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: chattbm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chattbm_test -d chattbm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://chattbm_test:test_password@localhost:5432/chattbm_test
      CHATTBM_MIGRATION_TEST_URL: postgres://chattbm_test:test_password@localhost:5432/chattbm_test
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run comparator unit tests
        run: node --test tests/schemaDryRunComparator.test.js
      - name: Run known-difference policy unit tests
        run: node --test tests/schemaKnownDifferencePolicy.test.js
      - name: Verify read-only PostgreSQL 18 catalog capture
        run: node --test tests/schemaDryRunComparator.integration.test.js
      - name: Inventory migration files and verify repeat application in disposable PostgreSQL 18
        run: node tests/postgresMigrationInventory.integration.test.js
