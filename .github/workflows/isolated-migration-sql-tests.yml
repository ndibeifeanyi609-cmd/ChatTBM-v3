name: Isolated Migration SQL Tests

on:
  pull_request:
    paths:
      - 'database/migrations/**'
      - 'scripts/runStagingMigrations.js'
      - 'tests/migrations/**'
      - '.github/workflows/isolated-migration-sql-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-migration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: chattbm_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: chattbm_staging_isolated
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chattbm_test -d chattbm_staging_isolated"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      STAGING_MIGRATION_DATABASE_URL: postgres://chattbm_test:test_password@localhost:5432/chattbm_staging_isolated
      STAGING_MIGRATION_APPROVAL: APPLY_TO_ISOLATED_STAGING_ONLY
      STAGING_MIGRATION_ALLOWED_HOSTS: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Verify migration manifest and SQL checksums
        run: node --test tests/migrations/manifest.test.js
      - name: Apply and rerun migrations in disposable PostgreSQL
        run: node --test tests/migrations/runner.integration.test.js
