name: Staging Backup Target Tests

on:
  pull_request:
    paths:
      - "scripts/staging-encrypted-backup.sh"
      - "scripts/staging-backup.Dockerfile"
      - "tests/staging_encrypted_backup_target_test.py"
      - "tests/staging_restore_validation_workflow_test.py"
      - ".github/workflows/staging-backup-target-tests.yml"
  push:
    branches:
      - main
      - docs/render-staging-backup-architecture-review
    paths:
      - "scripts/staging-encrypted-backup.sh"
      - "scripts/staging-backup.Dockerfile"
      - "tests/staging_encrypted_backup_target_test.py"
      - ".github/workflows/staging-backup-target-tests.yml"

permissions:
  contents: read

jobs:
  staging-backup-target-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run staging backup target safety tests
        run: python3 tests/staging_encrypted_backup_target_test.py

      - name: Run staging restore workflow safety tests
        run: python3 tests/staging_restore_validation_workflow_test.py

      - name: Build isolated staging backup image
        run: docker build --pull --file scripts/staging-backup.Dockerfile --tag chattbm-staging-backup:test .
