name: Email Verification PostgreSQL Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'auth/EmailVerificationService.js'
      - 'database/migrations/006_email_verification_tokens.sql'
      - 'tests/emailVerificationPostgres.integration.test.js'
      - '.github/workflows/email-verification-postgres-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chattbm_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: chattbm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chattbm_test -d chattbm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://chattbm_test:test_password@localhost:5432/chattbm_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --test tests/emailVerificationPostgres.integration.test.js
