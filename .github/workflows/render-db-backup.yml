name: Encrypted Isolated Staging Backup Restore Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-and-restore-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      restore-postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: restore_test
          POSTGRES_PASSWORD: restore_test_password
          POSTGRES_DB: restore_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restore_test -d restore_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Verify required secrets and approved bucket
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_PASSPHRASE"
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
          test -n "$R2_ACCOUNT_ID"
          test "$R2_BUCKET_NAME" = "chattbm-staging-backups"
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 18 client, GnuPG, and AWS CLI
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg unzip
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          aws --version
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fLsS --retry 5 --retry-all-errors --retry-delay 2 https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/apt.postgresql.org.asc
          test -s /tmp/apt.postgresql.org.asc
          sudo gpg --dearmor --yes -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg /tmp/apt.postgresql.org.asc
          rm -f /tmp/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
      - name: Select and download latest encrypted staging backup from R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3api list-objects-v2 --bucket "$R2_BUCKET_NAME" --prefix "chattbm-staging-" --endpoint-url "$endpoint" --output json > /tmp/r2-objects.json
          object_key="$(python3 - <<'PY'
          import json
          with open("/tmp/r2-objects.json", encoding="utf-8") as source:
              payload = json.load(source)
          objects = [
              item for item in payload.get("Contents", [])
              if item.get("Key", "").endswith(".dump.gpg")
          ]
          if not objects:
              raise SystemExit("No encrypted staging backup was found in the approved R2 bucket.")
          latest = max(objects, key=lambda item: item["LastModified"])
          print(latest["Key"])
          PY
          )"
          case "$object_key" in
            chattbm-staging-*.dump.gpg) ;;
            *) echo "Unexpected backup object key." >&2; exit 1 ;;
          esac
          echo "Selected encrypted staging backup: $object_key"
          echo "backup_object_key=$object_key" >> "$GITHUB_OUTPUT"
          aws s3 cp "s3://${R2_BUCKET_NAME}/${object_key}" /tmp/restore-test.dump.gpg --endpoint-url "$endpoint" --only-show-errors
          test -s /tmp/restore-test.dump.gpg
        id: backup
      - name: Decrypt and restore into disposable PostgreSQL
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          plain="/tmp/chattbm-restore-test.dump"
          trap 'rm -f "$plain" /tmp/restore-test.dump.gpg' EXIT
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --decrypt /tmp/restore-test.dump.gpg 3<<<"$BACKUP_ENCRYPTION_PASSPHRASE" > "$plain"
          test -s "$plain"
          docker run --rm --network host -e PGPASSWORD=restore_test_password -v "$plain:/backup.dump:ro" postgres:18-alpine sh -c '
            set -eu
            pg_restore --exit-on-error --host=127.0.0.1 --username=restore_test --dbname=restore_validation --no-owner --no-privileges /backup.dump
            count=$(psql --host=127.0.0.1 --username=restore_test --dbname=restore_validation --tuples-only --no-align --command "SELECT count(*) FROM information_schema.tables WHERE table_schema = current_schema() AND table_type = chr(66)||chr(65)||chr(83)||chr(69)||chr(32)||chr(84)||chr(65)||chr(66)||chr(76)||chr(69) AND table_name LIKE chr(99)||chr(104)||chr(97)||chr(116)||chr(116)||chr(98)||chr(109)||chr(95)||chr(37)")
            test "$count" -ge 5
            echo "RESTORE_VALIDATION_OK: core ChatTBM tables restored in disposable PostgreSQL."
          '
      - name: Remove local encrypted backup
        if: always()
        run: rm -f /tmp/chattbm-staging-*.dump.gpg /tmp/restore-test.dump.gpg /tmp/chattbm-restore-test.dump /tmp/r2-objects.json
