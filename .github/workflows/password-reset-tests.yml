name: Password Reset Tests

on:
  push:
    branches:
      - feature/resend-password-reset
  pull_request:
    branches:
      - main
    paths:
      - 'auth/**'
      - 'database/Postgres.js'
      - 'ui/ChatAPI.mjs'
      - 'ui/ChatTBMBrowser.mjs'
      - '.github/workflows/password-reset-tests.yml'

jobs:
  password-reset-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run password reset email tests
        run: node --test auth/PasswordResetEmail.test.js
      - name: Run authentication service tests
        run: node --test auth/AuthService.test.js
