name: Password Reset Tests

on:
  push:
    branches:
      - feature/resend-password-reset
  pull_request:
    branches:
      - main
    paths:
      - 'auth/**'
      - 'database/Postgres.js'
      - 'ui/ChatAPI.mjs'
      - 'ui/ChatTBMBrowser.mjs'
      - '.github/workflows/password-reset-tests.yml'

jobs:
  password-reset-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chattbm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chattbm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/chattbm_test
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run password reset service tests
        run: node --test auth/PasswordResetService.test.js
      - name: Run password reset PostgreSQL integration test
        run: node --test auth/PasswordResetPostgres.integration.test.js
      - name: Run password reset email tests
        run: node --test auth/PasswordResetEmail.test.js
      - name: Run password reset UI wiring tests
        run: node --test ui/PasswordResetUI.test.js
      - name: Run authentication service tests
        run: node --test auth/AuthService.test.js
