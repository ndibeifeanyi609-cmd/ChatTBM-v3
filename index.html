<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ChatTBM</title>

    <meta name="theme-color"
          content="#0B0B0F">

    <meta name="description"
          content="ChatTBM - Your AI Content Assistant">

    <!-- Favicon -->
    <link rel="icon"
          type="image/png"
          href="IMG_4365.png">

    <link rel="apple-touch-icon"
          href="IMG_4365.png">

    <!-- Google Font -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Style -->
    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<!-- ========================= -->
<!-- HEADER -->
<!-- ========================= -->

<header class="header">

    <div class="header-left">

        <img
        src="IMG_4365.png"
        class="logo-small"
        alt="ChatTBM">

        <span class="brand">

            ChatTBM

        </span>

    </div>

    <div class="header-right">

        <button
        id="image-btn"
        class="icon-btn">

            🖼️

        </button>

        <button
        id="signin-btn">

            Sign In

        </button>

        <button
        id="signup-btn">

            Sign Up

        </button>

    </div>

</header>

<!-- ========================= -->
<!-- WELCOME -->
<!-- ========================= -->

<section
id="welcome-screen">

    <img
    src="IMG_4365.png"
    class="hero-logo"
    alt="ChatTBM">

    <h1>

        ChatTBM

    </h1>

    <p>

        Your AI Content Assistant

    </p>

</section>

<!-- ========================= -->
<!-- CHAT -->
<!-- ========================= -->

<main>

    <div
    id="chat-box"
    class="chat-box hidden">

    </div>

</main>

<!-- ========================= -->
<!-- QUICK TOOLS -->
<!-- ========================= -->

<section
class="quick-tools">

<button onclick="creatorTool('ideas')">

💡 Ideas

</button>

<button onclick="creatorTool('hooks')">

🔥 Hooks

</button>

<button onclick="creatorTool('captionTemplates')">

✍️ Captions

</button>

<button onclick="creatorTool('hashtags')">

#️⃣ Hashtags

</button>

<button onclick="videoTool('script')">

🎬 Scripts

</button>

<button onclick="videoTool('image')">

🖼️ Prompts

</button>

<button onclick="creatorTool('calendar')">

📅 Calendar

</button>

<button onclick="creatorTool('bio')">

👤 Bio

</button>

</section>

<!-- ========================= -->
<!-- INPUT -->
<!-- ========================= -->

<footer class="input-area">

<div class="input-wrapper">

<button
id="upload-btn">

＋

</button>

<input
type="file"
id="file-input"
hidden>

<textarea

id="user-input"

rows="1"

placeholder="Ask anything...">

</textarea>

<button
id="voice-btn">

🎤

</button>

<button
id="send-btn">

➜

</button>

</div>

</footer>

<!-- ========================= -->
<!-- JAVASCRIPT -->
<!-- ========================= -->

<script src="ai.js"></script>

<script src="apiManager.js"></script>

<script src="users.js"></script>

<script src="app.js"></script>

<script src="script.js"></script>

</body>

</html>

<!-- ========================= -->
<!-- EXTRA CONTROLS -->
<!-- ========================= -->

<section class="controls">


<button id="new-chat-btn">

New Chat

</button>


<button id="copy-btn">

Copy

</button>


<button id="regenerate-btn">

Regenerate

</button>


<button id="upgrade-btn">

Upgrade

</button>


<button id="settings-btn">

Settings

</button>


</section>





<!-- ========================= -->
<!-- DASHBOARD -->
<!-- ========================= -->


<div

id="dashboard-panel"

style="display:none;">


<h2>

ChatTBM Dashboard

</h2>


<p>

User:

<span id="dashboard-name">

Guest

</span>


</p>



<p>

Plan:

<span id="dashboard-plan">

Free

</span>


</p>



<p id="dashboard-usage">

0 messages used

</p>



<button id="close-dashboard">

Close

</button>


</div>





<!-- ========================= -->
<!-- SETTINGS OPTIONS -->
<!-- ========================= -->


<div class="settings-panel">


<button id="dark-mode-btn">

Dark Mode

</button>


<button id="light-mode-btn">

Light Mode

</button>


<button id="notification-btn">

Notifications

</button>


</div>





<!-- ========================= -->
<!-- JAVASCRIPT -->
<!-- ========================= -->


<script src="script.js"></script>


</body>


</html>
