<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>ChatTBM</title>


<!-- Favicon -->

<link rel="icon" type="image/png" href="IMG_4397.png">

<link rel="apple-touch-icon" href="IMG_4397.png">


<!-- Tailwind -->

<script src="https://cdn.tailwindcss.com"></script>



<style>


body{

background:#000;

color:#fff;

font-family:

-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;

}




/* Main Logo */


.main-logo{

width:100px;

height:100px;

border-radius:9999px;

}





/* Buttons */


.action-btn{

width:100%;

background:#1f1f1f;

transition:.25s;

}



.action-btn:hover{

background:#2b2b2b;

transform:translateY(-3px);

}




/* Input Icons */


.icon-btn{

width:52px;

height:52px;

border-radius:9999px;

display:flex;

align-items:center;

justify-content:center;

transition:.2s;

}







/* V4.2 Suggestion Cards */


.suggest-card{


background:#111;

border:1px solid #222;

border-radius:22px;

padding:18px;

text-align:center;

font-size:14px;

transition:.25s;


}



.suggest-card:hover{


background:#1f1f1f;

border-color:#2563eb;

transform:translateY(-3px);


}







/* Welcome Text */


.welcome-title{

font-size:30px;

font-weight:700;

}



.welcome-subtitle{

color:#999;

font-size:16px;

line-height:1.6;

}





</style>


</head>





<body class="min-h-screen bg-black text-white">





<div class="max-w-lg mx-auto px-5 py-6">

ChatTBM
