<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ChatTBM</title>

<meta name="theme-color"
content="#0B0B0F">

<meta name="description"
content="ChatTBM - Your AI Content Assistant">


<!-- ========================= -->
<!-- FAVICON -->
<!-- ========================= -->

<link rel="icon"
type="image/png"
href="IMG_4397.png">

<link rel="apple-touch-icon"
href="IMG_4397.png">


<!-- ========================= -->
<!-- GOOGLE FONT -->
<!-- ========================= -->

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">


<!-- ========================= -->
<!-- STYLESHEET -->
<!-- ========================= -->

<link rel="stylesheet"
href="style.css">

</head>

<body>


<!-- ========================= -->
<!-- HEADER -->
<!-- ========================= -->

<header class="header">

<div class="header-left">

<img
src="4AEBEE18-6FA9-470F-9C0F-29930C59BCB7.png"
class="logo-small"
alt="ChatTBM Logo">

<span class="brand">

ChatTBM

</span>

</div>

<div class="header-right">

<button
id="login-btn"
class="header-btn">

Sign In

</button>

<button
id="signup-btn"
class="header-btn primary">

Sign Up

</button>

</div>

</header>


<!-- ========================= -->
<!-- WELCOME SCREEN -->
<!-- ========================= -->

<section
id="welcome-screen"
class="welcome-screen">

<img
src="4AEBEE18-6FA9-470F-9C0F-29930C59BCB7.png"
class="hero-logo"
alt="ChatTBM Logo">

<h1>

ChatTBM

</h1>

<p>

Your AI Content Assistant for Captions, Scripts & Viral Ideas

</p>

</section>


<!-- ========================= -->
<!-- CHAT CONTAINER -->
<!-- ========================= -->

<main
id="chat-container"
class="chat-container">

<div
id="chat-box"
class="chat-box">

<!-- Messages appear here -->

</div>

</main>

<!-- ========================= -->
<!-- ATTACHMENT PREVIEW -->
<!-- ========================= -->

<section
id="attachment-preview"
class="attachment-preview">

</section>


<!-- ========================= -->
<!-- QUICK ACTIONS -->
<!-- ========================= -->

<section
class="quick-actions">

<button
class="quick-btn"
data-prompt="Write a viral caption">

✍️ Caption

</button>

<button
class="quick-btn"
data-prompt="Generate content ideas">

💡 Ideas

</button>

<button
class="quick-btn"
data-prompt="Write a short video script">

🎬 Script

</button>

<button
class="quick-btn"
data-prompt="Generate hashtags">

#️⃣ Hashtags

</button>

</section>


<!-- ========================= -->
<!-- INPUT AREA -->
<!-- ========================= -->

<footer
class="input-area">

<div
class="input-wrapper">

<button
id="upload-btn"
class="tool-btn"
title="Upload File">

＋

</button>

<input
type="file"
id="file-input"
hidden>

<textarea

id="user-input"

placeholder="Ask anything..."

rows="1"

autocomplete="off">

</textarea>

<button

id="voice-btn"

class="tool-btn"

title="Voice Input">

🎤

</button>

<button

id="send-btn"

class="send-btn"

title="Send">

➜

</button>

</div>

</footer>

<!-- ========================= -->
<!-- DASHBOARD PANEL -->
<!-- ========================= -->

<section
id="dashboard-panel"
class="dashboard-panel hidden">

<div class="dashboard-card">

<h2>

Dashboard

</h2>

<p>

User:
<strong id="dashboard-name">

Guest

</strong>

</p>

<p>

Plan:
<strong id="dashboard-plan">

Free

</strong>

</p>

<p id="dashboard-usage">

0 / 20 messages used today

</p>

<button
id="close-dashboard"
class="secondary-btn">

Close

</button>

</div>

</section>


<!-- ========================= -->
<!-- LOADING INDICATOR -->
<!-- ========================= -->

<div
id="loading-indicator"
class="loading-indicator hidden">

<div class="loader"></div>

<p>

ChatTBM is thinking...

</p>

</div>


<!-- ========================= -->
<!-- TOAST MESSAGE -->
<!-- ========================= -->

<div
id="toast"
class="toast hidden">

Ready

</div>


<!-- ========================= -->
<!-- JAVASCRIPT -->
<!-- ========================= -->

<script src="script.js"></script>

</body>

</html>
