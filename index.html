<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatTBM</title>
   <link rel="icon" type="image/png" href="IMG_4397.png">
<link rel="apple-touch-icon" href="IMG_4397.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: white; }
        .main-logo { width: 160px; height: 160px; border-radius: 9999px; }
        .action-btn {
            background: #1f1f1f;
            transition: all 0.2s;
        }
        .action-btn:hover {
            background: #2a2a2a;
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

 <div class="flex items-center justify-between mb-10">

   <!-- Header -->
<div class="flex items-center justify-between mb-10">

    <!-- Left: Logo -->
    <div class="flex items-center gap-3">
        <img src="4AEBEE18-6FA9-470F-9C0F-29930C59BCB7.png"
             alt="ChatTBM"
             class="w-9 h-9 rounded-full">

        <span class="text-2xl font-bold">ChatTBM</span>
    </div>

    <!-- Right: Sign In -->
    <button id="signin-btn"
        class="px-4 py-2 text-sm rounded-full border border-gray-600 hover:border-blue-500 hover:bg-gray-900 transition">
        Sign In
    </button>

</div>

    <!-- Right -->
    <div class="flex items-center gap-2">

        <button
            class="text-sm px-3 py-2 border border-gray-600 rounded-full hover:border-blue-500">
            Sign In
        </button>

        <button
            class="text-sm px-3 py-2 bg-blue-600 rounded-full hover:bg-blue-700">
            Sign Up
        </button>

    </div>

</div>

    <!-- Right: Authentication -->
    <div class="flex items-center gap-3">

        <button id="signin-btn"
            class="px-4 py-2 rounded-full bg-transparent border border-gray-600 hover:border-blue-500 transition">
            Sign In
        </button>

        <button id="signup-btn"
            class="px-4 py-2 rounded-full bg-blue-600 hover:bg-blue-700 transition">
            Sign Up
        </button>

    </div>

</div>

        <!-- Quick Actions -->
        <div class="space-y-4 mb-12">
            <button class="action-btn w-full text-left px-6 py-5 rounded-3xl text-[17px] flex items-center gap-4">
                ✍️ Create a viral caption
            </button>
            <button class="action-btn w-full text-left px-6 py-5 rounded-3xl text-[17px] flex items-center gap-4">
                🎬 Generate video ideas
            </button>
            <button class="action-btn w-full text-left px-6 py-5 rounded-3xl text-[17px] flex items-center gap-4">
                📱 Write social media posts
            </button>
        </div>

        <!-- Input with + Button -->
        <div class="flex items-center gap-3 bg-[#1f1f1f] rounded-full p-2">
            <button onclick="alert('New chat or attachment coming soon!')" 
                    class="w-12 h-12 flex items-center justify-center text-2xl hover:bg-gray-800 rounded-full transition">
                +
            </button>
            
            <input type="text" id="user-input"
       class="flex-1 bg-transparent px-4 py-4 outline-none text-[17px]"
       placeholder="Ask anything...">

<div class="flex items-center gap-2">

    <button id="voice-btn"
        class="w-12 h-12 rounded-full bg-gray-700 hover:bg-gray-600 flex items-center justify-center text-xl transition"
        title="Voice Input">
        🎤
    </button>

    <button id="send-btn"
        class="w-12 h-12 rounded-full bg-blue-600 hover:bg-blue-700 flex items-center justify-center text-xl transition"
        title="Send">
        ➤
    </button>

</div>

<script>
    const input = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    function sendMessage() {
        const text = input.value.trim();
        if (text) {
            alert("You said: " + text + "\n\n(Real AI responses coming soon!)");
            input.value = "";
        }
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
    });
</script>

</body>
</html>
