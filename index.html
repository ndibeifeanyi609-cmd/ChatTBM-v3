<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChatTBM - AI Content Assistant</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/favicon.png">

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- APP CONTAINER -->
    <div class="app-container">


        <!-- HEADER -->
        <header class="app-header">

            <div class="brand">

                <img 
                src="assets/logo.png" 
                alt="ChatTBM Logo"
                class="logo">

                <div class="brand-text">
                    <h1>ChatTBM</h1>
                    <p>Your AI Content Assistant</p>
                </div>

            </div>


            <div class="auth-buttons">

                <button id="login-btn">
                    Log In
                </button>

                <button id="signup-btn">
                    Sign Up
                </button>

            </div>

        </header>



        <!-- WELCOME SECTION -->
        <section class="welcome-screen">

            <img 
            src="assets/logo.png"
            alt="ChatTBM"
            class="hero-logo">


            <h2>
                Welcome to ChatTBM
            </h2>


            <p>
                Your AI assistant for captions,
                scripts, viral ideas, adverts and content creation.
            </p>


        </section>





        <!-- CHAT AREA -->

        <main class="chat-container">


            <div id="chat-box" class="chat-box">


                <div class="message bot-message">

                    <p>
                        Hello 👋 I am ChatTBM.
                        I can help you create captions,
                        scripts, ideas and marketing content.
                    </p>

                </div>


            </div>




            <!-- CREATOR TOOLS -->

            <div class="creator-tools">


                <button class="tool-btn" data-tool="caption">
                    ✍️ Caption
                </button>


                <button class="tool-btn" data-tool="script">
                    🎬 Script
                </button>


                <button class="tool-btn" data-tool="hashtags">
                    #️⃣ Hashtags
                </button>


                <button class="tool-btn" data-tool="ideas">
                    💡 Viral Ideas
                </button>


                <button class="tool-btn" data-tool="advert">
                    📢 Advert
                </button>


                <button class="tool-btn" data-tool="calendar">
                    📅 Calendar
                </button>


            </div>





            <!-- INPUT AREA -->

            <div class="input-area">


                <button id="upload-btn" class="upload-btn">
                    +
                </button>


                <input 
                type="text"
                id="user-input"
                placeholder="Ask ChatTBM anything...">


                <button id="send-btn">
                    Send
                </button>


            </div>



        </main>





        <!-- FOOTER -->

        <footer class="app-footer">

            <p>
                ChatTBM AI Content Assistant
            </p>

        </footer>



    </div>





    <!-- Main JavaScript -->

    <script src="script.js"></script>


</body>

</html>
