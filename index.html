<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatTBM</title>
   <link rel="icon" type="image/png" href="IMG_4397.png">
<link rel="apple-touch-icon" href="IMG_4397.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: white; }
        .main-logo { width: 160px; height: 160px; border-radius: 9999px; }
        .action-btn {
            background: #1f1f1f;
            transition: all 0.2s;
        }
        .action-btn:hover {
            background: #2a2a2a;
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg mx-auto">
        <!-- Top Small Logo -->
        <div class="flex items-center gap-3 mb-12">
            <img src="4AEBEE18-6FA9-470F-9C0F-29930C59BCB7.png" alt="ChatTBM" class="w-9 h-9 rounded-full">
            <span class="text-2xl font-semibold">ChatTBM</span>
        </div>

        <!-- Big Logo -->
        <div class="flex justify-center mb-12">
            <img src="4AEBEE18-6FA9-470F-9C0F-29930C59BCB7.png" alt="ChatTBM" class="main-logo">
        </div>

        <!-- Quick Actions -->
        <div class="space-y-4 mb-12">
            <button class="action-btn w-full text-left px-6 py-5 rounded-3xl text-[17px] flex items-center gap-4">
                ✍️ Create a viral caption
            </button>
            <button class="action-btn w-full text-left px-6 py-5 rounded-3xl text-[17px] flex items-center gap-4">
                🎬 Generate video ideas
            </button>
            <button class="action-btn w-full text-left px-6 py-5 rounded-3xl text-[17px] flex items-center gap-4">
                📱 Write social media posts
            </button>
        </div>

        <!-- Input with + Button -->
        <div class="flex items-center gap-3 bg-[#1f1f1f] rounded-full p-2">
            <button onclick="alert('New chat or attachment coming soon!')" 
                    class="w-12 h-12 flex items-center justify-center text-2xl hover:bg-gray-800 rounded-full transition">
                +
            </button>
            
            <input type="text" id="user-input" 
                   class="flex-1 bg-transparent px-4 py-4 outline-none text-[17px]" 
                   placeholder="Ask anything...">
            
            <button id="send-btn" 
                    class="bg-blue-600 hover:bg-blue-700 px-8 py-4 rounded-full font-semibold">
                Send
            </button>
        </div>
    </div>

<script>
    const input = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    function sendMessage() {
        const text = input.value.trim();
        if (text) {
            alert("You said: " + text + "\n\n(Real AI responses coming soon!)");
            input.value = "";
        }
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
    });
</script>

</body>
</html>
