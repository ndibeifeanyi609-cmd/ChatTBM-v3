<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Signing in - ChatTBM</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#fff;font:16px system-ui,sans-serif}
main{max-width:28rem;padding:2rem;text-align:center}
p{color:#aaa;line-height:1.6}
</style>
</head>
<body>
<main>
<h1>Signing you in…</h1>
<p id="status" role="status">Securely preparing your ChatTBM session.</p>
</main>
<script type="module">
const status = document.getElementById('status');
const params = new URLSearchParams(window.location.search);
const code = params.get('code');
const flow = params.get('flow');
history.replaceState(null, '', '/auth/google-handoff.html');
if (!code) {
  status.textContent = 'This sign-in link is missing or expired. Please return to ChatTBM and try again.';
} else {
  try {
    const response = await fetch('https://chattbm-backend.onrender.com/api/auth/google/session-handoff', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code }),
      credentials: 'omit',
      cache: 'no-store',
      referrerPolicy: 'no-referrer'
    });
    const data = await response.json();
    if (!response.ok || data.success !== true || typeof data.token !== 'string' || !data.token) {
      throw new Error(data?.error?.message || 'Google sign-in could not be completed.');
    }
    sessionStorage.setItem('chattbm_session_token', data.token);
    if (flow === 'link') {
      sessionStorage.setItem('chattbm_google_linked_success', '1');
    }
    window.location.replace('/');
  } catch (_) {
    status.textContent = 'Google sign-in could not be completed. Please return to ChatTBM and try again.';
  }
}
</script>
</body>
</html>
